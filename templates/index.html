<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNKRDUNK 爬虫网站</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --bg: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Image Modal */
.modal {
  display: none; position: fixed; z-index: 1000; left: 0; top: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,.85);
  justify-content: center; align-items: center; cursor: pointer;
}
.modal.active { display: flex; }
.modal-content {
  max-width: 90vw; max-height: 90vh; text-align: center;
  cursor: default; position: relative;
}
.modal-content img {
  max-width: 100%; max-height: 80vh; border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.modal-title {
  color: #fff; padding: 12px 0; font-size: 16px; font-weight: 600;
  text-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.modal-close {
  position: fixed; top: 20px; right: 30px; color: #fff;
  font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1001;
  transition: opacity .2s;
}
.modal-close:hover { opacity: .7; }
  .header {
    background: linear-gradient(135deg, var(--primary), #a855f7);
    padding: 20px 0;
    text-align: center;
  }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 4px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg-card); border-radius: var(--radius); padding: 4px; }
  .tab-btn {
    flex: 1; padding: 10px 16px; border: none; background: transparent;
    color: var(--text-muted); cursor: pointer; border-radius: 6px;
    font-size: 14px; transition: all .2s;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .tab-btn.active { color: #fff; background: var(--primary); }

  /* Cards */
  .card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
  .card h2 { font-size: 18px; margin-bottom: 16px; }

  /* Forms */
  .form-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .form-row input, .form-row select {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-input); color: var(--text); font-size: 14px; flex: 1; min-width: 200px;
  }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--primary); }

  .btn {
    padding: 10px 20px; border: none; border-radius: var(--radius);
    cursor: pointer; font-size: 14px; font-weight: 600; transition: all .2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #16a34a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--bg-input); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; }
  tr:hover td { background: rgba(99,102,241,.08); }
  .cond-row td { padding: 6px 12px 10px 44px; background: var(--bg-input); border-bottom: 1px solid var(--border); }
  .cond-row:hover td { background: var(--bg-input); }
  .text-muted { color: var(--text-muted); }
  .text-right { text-align: right; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Progress */
  .progress-wrap { background: var(--bg-input); border-radius: 99px; height: 8px; overflow: hidden; margin: 12px 0; }
  .progress-bar { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }
  .status-msg { font-size: 13px; color: var(--text-muted); }

  /* Badge */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-info { background: rgba(99,102,241,.2); color: #818cf8; }
  .badge-success { background: rgba(34,197,94,.2); color: #4ade80; }

  /* Filter input */
  .filter-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font-size: 13px; margin-bottom: 12px; }

  /* Checkbox */
  input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--text-muted); }

  .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--text-muted); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: var(--radius); color: #fff; font-size: 14px; z-index: 999; animation: slideIn .3s; }
  .toast-success { background: var(--success); }
  .toast-error { background: var(--danger); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  /* 开关样式 */
  .switch-wrap { display:inline-block; position:relative; width:36px; height:20px; cursor:pointer; }
  .switch-wrap input { opacity:0; width:0; height:0; }
  .switch-slider { position:absolute; inset:0; background:#555; border-radius:20px; transition:.3s; }
  .switch-slider::after { content:''; position:absolute; height:16px; width:16px; left:2px; bottom:2px; background:white; border-radius:50%; transition:.3s; }
  .switch-wrap input:checked + .switch-slider { background:#22c55e; }
  .switch-wrap input:checked + .switch-slider::after { transform:translateX(16px); }
</style>
</head>
<body>

<div class="header">
  <div style="max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <h1>SNKRDUNK 爬虫网站</h1>
      <p>搜索、浏览、爬取 SNKRDUNK 交易卡数据</p>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span id="fxLabel" style="font-size:12px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.2);padding:4px 10px;border-radius:6px"></span>
      <button onclick="showChangePwd()" style="color:rgba(255,255,255,.9);background:rgba(99,102,241,.6);text-decoration:none;font-size:13px;padding:8px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;transition:all .2s;font-weight:600" onmouseover="this.style.background='rgba(99,102,241,.85)'" onmouseout="this.style.background='rgba(99,102,241,.6)'">🔑 修改密码</button>
      <button onclick="restartService()" style="color:rgba(255,255,255,.9);background:rgba(239,68,68,.6);text-decoration:none;font-size:13px;padding:8px 14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;transition:all .2s;font-weight:600" onmouseover="this.style.background='rgba(239,68,68,.85)'" onmouseout="this.style.background='rgba(239,68,68,.6)'">🔄 重启服务</button>
      <a href="/logout" style="color:rgba(255,255,255,.8);text-decoration:none;font-size:14px;padding:8px 16px;border:1px solid rgba(255,255,255,.3);border-radius:6px;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,.1)'" onmouseout="this.style.background='transparent'">退出登录</a>
    </div>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="search">🔍 搜索</button>
    <button class="tab-btn" data-tab="data">📦 数据 (0)</button>
    <button class="tab-btn" data-tab="stats">📊 统计</button>
  </div>

  <!-- Tab: Search -->
  <div class="tab-content" id="tab-search" style="width:100%;max-width:none">
    <div class="card" style="width:100%;max-width:none">
      <h2>搜索交易卡</h2>
      <div class="form-row">
        <select id="productType" style="flex:0 0 150px;min-width:150px" onchange="onProductTypeChange()">
          <option value="single">🃏 卡牌（シングル）</option>
          <option value="box_pack">📦 卡包（ボックス・パック）</option>
        </select>
        <input type="text" id="searchInput" placeholder="关键词，如: sv8 pikachu 136" value=""
               onkeydown="if(event.key==='Enter') doSearch()">
        <select id="maxResults" style="flex:0 0 110px;min-width:110px">
          <option value="20">20 条</option>
          <option value="50" selected>50 条</option>
          <option value="100">100 条</option>
          <option value="200">200 条</option>
        </select>
        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
        <span class="text-muted" id="unitHint" style="font-size:12px;align-self:center">枚数固定：1 枚</span>
      </div>
    </div>

    <!-- Crawl Status -->
    <div class="card" id="crawlStatus" style="display:none;width:100%;max-width:none">
      <h2>爬取进度</h2>
      <div class="progress-wrap"><div class="progress-bar" id="crawlProgress"></div></div>
      <div class="status-msg" id="crawlMsg"></div>
    </div>

    <!-- Search Results -->
    <div class="card" id="searchResults" style="display:none;width:100%;max-width:none">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">搜索结果</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="text-muted" id="resultCount"></span>
          <button class="btn btn-success btn-sm" id="crawlBtn" onclick="crawlSelected()">爬取选中</button>
          <label style="font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:4px">
            <input type="checkbox" id="selectAll" onchange="toggleAll()"> 全选
          </label>
        </div>
      </div>
      <div id="searchNote" style="color:var(--text-muted);font-size:11px;margin:-6px 0 8px;line-height:1.6">
        注：成色价格显示为最新已售(1枚)。由于平台接口限制只返回最近约 20 笔成交，个别成色若一段时间没有成交，
        会退回显示当前在售价。
      </div>
      <div class="table-wrap"><table><thead>
        <tr><th style="width:32px"></th><th>ID</th><th style="min-width:280px">名称</th></tr>
      </thead><tbody id="searchTableBody"></tbody></table></div>
    </div>
    <div class="card" id="searchEmpty" style="display:none;width:100%;max-width:none">
      <div style="text-align:center;color:var(--text-muted);padding:18px 0">
        <div style="font-size:16px;margin-bottom:6px">没有找到符合条件的数据</div>
        <div id="searchEmptyHint" style="font-size:13px"></div>
      </div>
    </div>
  </div>

  <!-- Tab: Data -->
  <div class="tab-content" id="tab-data" style="display:none;width:100%;max-width:none">
    <div class="card" style="width:100%;max-width:none">
      <h2>已保存卡片数据</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <input class="filter-input" type="text" id="dataFilter" placeholder="过滤名称..." oninput="filterData()" style="flex:1;margin-bottom:0;min-width:200px">
        <button class="btn btn-danger btn-sm" id="batchDelBtn" onclick="batchDelete()" style="display:none">删除选中</button>
        <button class="btn btn-primary btn-sm" id="importBtn" onclick="importToMySQL()" style="display:none">导入 MySQL</button>
        <button class="btn btn-sm" onclick="loadData(this)" style="background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer">🔄 刷新</button>
      </div>
      <div class="table-wrap"><table style="width:100%"><thead>
        <tr><th style="width:32px"><input type="checkbox" id="dataSelectAll" onchange="toggleDataAll()"></th><th>ID</th><th>名称</th><th>品牌</th><th>成色</th><th>成交价</th><th>操作</th></tr>
      </thead><tbody id="dataTableBody"></tbody></table></div>
      <div class="empty" id="dataEmpty">暂无数据，请先搜索并爬取卡片</div>
    </div>
  </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal" onclick="closeImage()">
  <span class="modal-close">&times;</span>
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <img id="modalImage" src="" alt="">
  </div>
</div>

<!-- Confirm Modal（自製確認框，避免 IDE webview 對原生 confirm 支援不佳） -->
<div id="confirmModal" class="modal" style="z-index:2000">
  <div style="background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:24px 26px;max-width:420px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.55)" onclick="event.stopPropagation()">
    <div style="font-size:15px;line-height:1.7;margin-bottom:20px;word-break:break-word" id="confirmMsg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn" id="confirmCancel" style="background:var(--bg-input);border:1px solid var(--border);color:var(--text)">取消</button>
      <button type="button" class="btn btn-danger" id="confirmOk">確定</button>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div id="changePwdModal" class="modal" style="z-index:2000">
  <div style="background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:28px 30px;max-width:420px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.55)" onclick="event.stopPropagation()">
    <div style="font-size:18px;font-weight:700;margin-bottom:20px">🔑 修改密码</div>
    <div id="changePwdError" style="color:var(--danger);font-size:13px;margin-bottom:10px;display:none"></div>
    <div style="margin-bottom:14px">
      <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">当前密码</label>
      <input type="password" id="cpOld" placeholder="输入当前密码" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text);font-size:14px" onkeydown="if(event.key==='Enter') doChangePwd()">
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">新密码（至少 6 位）</label>
      <input type="password" id="cpNew" placeholder="输入新密码" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text);font-size:14px" onkeydown="if(event.key==='Enter') doChangePwd()">
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">确认新密码</label>
      <input type="password" id="cpNew2" placeholder="再输一次新密码" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text);font-size:14px" onkeydown="if(event.key==='Enter') doChangePwd()">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn" onclick="hideChangePwd()" style="background:var(--bg-input);border:1px solid var(--border);color:var(--text)">取消</button>
      <button type="button" class="btn btn-primary" id="cpSubmitBtn" onclick="doChangePwd()">确认修改</button>
    </div>
  </div>
</div>

<!-- Tab: Stats -->
<div class="tab-content" id="tab-stats" style="display:none">
  <div class="stats-grid" id="statsGrid"></div>
  <div class="card">
    <h2>⏰ 自动更新价格</h2>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
        <input type="checkbox" id="autoUpdateToggle" onchange="saveAutoUpdateSettings()" style="width:18px;height:18px;cursor:pointer">
        启用自动更新
      </label>
      <label style="font-size:14px;display:flex;align-items:center;gap:4px">
        时间1:
        <input type="time" id="autoUpdateTime1" value="08:00" onchange="saveAutoUpdateSettings()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:13px">
      </label>
      <label style="font-size:14px;display:flex;align-items:center;gap:4px">
        时间2:
        <input type="time" id="autoUpdateTime2" value="20:00" onchange="saveAutoUpdateSettings()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:13px">
      </label>
      <button class="btn btn-primary btn-sm" onclick="runAutoUpdateNow()" style="padding:6px 14px;font-size:13px">🔄 手动更新</button>
      <button class="btn btn-sm" onclick="loadStats();toast('已刷新','success')" style="background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px">🔃 刷新统计</button>
      <div id="autoUpdateStatus" style="font-size:13px;color:var(--text-muted)"></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>📋 导入详情</h2>
    <div style="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap">
      <input type="text" id="statsNameFilter" placeholder="🔍 搜索名称..." style="width:30%;max-width:260px;flex-shrink:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:13px" oninput="filterStats()">
      <select id="statsConditionFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);font-size:13px" onchange="filterStats()">
        <option value="">全部成色</option>
        <option value="S">S 新品（卡包）</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="PSA 10">PSA 10</option>
        <option value="PSA 9">PSA 9</option>
        <option value="PSA 8 or under">PSA 8 or under</option>
        <option value="BGS 10 BL">BGS 10 BL</option>
        <option value="BGS 10 GL">BGS 10 GL</option>
      </select>
    </div>
    <div id="statsImported" style="margin-top:8px"></div>
    <div id="statsNotImported" style="margin-top:8px"></div>
  </div>
</div>

</div> <!-- end container -->

<script>
// ============================================================
//  Tab 切换
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
    if (btn.dataset.tab === 'data') loadData();
    if (btn.dataset.tab === 'stats') { loadStats(); loadAutoUpdateSettings(); }
  });
});

// ============================================================
//  搜索
// ============================================================
let searchResults = [];

function getProductType() {
  return document.getElementById('productType').value === 'box_pack' ? 'box_pack' : 'single';
}

// 数量单位：卡牌按「张」、卡包按「个」；成交单位分别是 1枚 / 1個
function unitWord(ptype) {
  return ptype === 'box_pack' ? '个' : '张';
}

function onProductTypeChange() {
  const ptype = getProductType();
  const isBox = ptype === 'box_pack';
  document.getElementById('unitHint').textContent = isBox ? '单位固定：1 個（盒/包）' : '枚数固定：1 枚';
  document.getElementById('searchInput').placeholder = isBox
    ? '关键词，如: 黒炎の支配者 box' : '关键词，如: sv8 pikachu 136';
  document.getElementById('searchNote').innerHTML = isBox
    ? '注：卡包（Box/Pack）无成色分级，价格为「新品(S)」最新已售(1個)；无成交记录时退回当前在售价。'
    : '注：成色价格显示为最新已售(1枚)。由于平台接口限制只返回最近约 20 笔成交，个别成色若一段时间没有成交，会退回显示当前在售价。';
}

async function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  const max = document.getElementById('maxResults').value;
  const ptype = getProductType();
  if (!keyword) return toast('请输入关键词', 'error');

  const btn = document.querySelector('#tab-search .btn-primary');
  btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 搜索中...';

  try {
    const res = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}&max=${max}&type=${ptype}`);
    const data = await res.json();
    if (data.error) { toast(data.error, 'error'); searchResults = []; }
    else { searchResults = data.results; }
  } catch(e) {
    toast('搜索失败: ' + e.message, 'error');
    searchResults = [];
  }

  btn.disabled = false; btn.textContent = '搜索';
  renderSearchResults(searchResults);
}

function renderSearchResults(results) {
  const el = document.getElementById('searchResults');
  const emptyEl = document.getElementById('searchEmpty');
  const tbody = document.getElementById('searchTableBody');
  const count = document.getElementById('resultCount');

  const ptype = getProductType();
  if (!results.length) {
    el.style.display = 'none';
    if (emptyEl) {
      const hint = document.getElementById('searchEmptyHint');
      if (hint) hint.textContent = ptype === 'box_pack'
        ? '请换其他关键词再试。（卡包搜索固定单位为 1 個）'
        : '请换其他关键词再试。（搜索固定枚数为 1 枚）';
      emptyEl.style.display = 'block';
    }
    return;
  }

  if (emptyEl) emptyEl.style.display = 'none';
  el.style.display = 'block';
  count.textContent = `共 ${results.length} ${unitWord(ptype)}${ptype === 'box_pack' ? '卡包' : '卡片'}`;

  tbody.innerHTML = results.map((r, idx) => `
    <tr data-idx="${idx}" class="card-main-row">
      <td><input type="checkbox" class="card-check" value="${r.id}" onchange="updateCrawlBtn()"></td>
      <td class="text-muted">${r.id}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <img src="${r.thumbnail_url || ''}?size=s" 
               onerror="this.style.display='none'"
               style="width:40px;height:56px;object-fit:cover;border-radius:4px;cursor:pointer"
               onclick="showImage('${r.thumbnail_url || ''}?size=l', '${escapeHtml(r.card_name||'').replace(/'/g, "\\'")}')"
               alt="">
          <a href="https://snkrdunk.com/apparels/${r.id}" target="_blank" style="color:#818cf8;text-decoration:none">${escapeHtml(r.card_name||'')}</a>
        </div>
      </td>
    </tr>
    <tr class="cond-row" data-card="${r.id}">
      <td colspan="3">
        <div class="cond-prices" id="cond-${r.id}" style="font-size:12px;line-height:1.8;">
          <span style="color:var(--text-muted)">加载中...</span>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('selectAll').checked = false;
  updateCrawlBtn();

  // 自动加载所有卡片的详情与成色价格（分批并发加载，逐批渲染）
  loadSearchDetails(results);
}

// ============================================================
//  自动加载所有卡片的详情与成色价格
//  内容来自 https://snkrdunk.com/apparels/{id} 详情页
// ============================================================
const condCache = {};    // card_id -> {conditions, card_name, brand, product_code, image_url, ...}
const cardCatalog = {};  // card_id -> productCatalogId（搜索 payload 的 productId，用于并行抓取）
const cardTypes = {};    // card_id -> 'single' | 'box_pack'
if (!window._searchSeq) window._searchSeq = 0;

const GRADE_ORDER = ['S','A','B','C','D','PSA 10','PSA 9','PSA 8 or under',
                     'BGS 10 BL','BGS 10 GL','BGS 9.5','BGS 9 or under',
                     'ARS 10+','ARS 10','ARS 9','ARS 8 or under','Other'];

// 分批并发加载搜索结果里所有卡片的详情（每批服务端并发抓取，逐批渲染）
async function loadSearchDetails(results) {
  const seq = ++window._searchSeq;
  const countEl = document.getElementById('resultCount');
  const CHUNK = 10;

  // 记录 catalog_id（已知则让后端并行抓详情页与交易履历）与商品类型
  results.forEach(r => {
    if (r.catalog_id) cardCatalog[r.id] = r.catalog_id;
    cardTypes[r.id] = r.product_type === 'box_pack' ? 'box_pack' : 'single';
    if (condCache[r.id]) renderConditionDetail(r.id, condCache[r.id]);  // 命中缓存直接渲染
  });
  const pending = results.filter(r => !condCache[r.id]);
  if (!pending.length) return;

  for (let i = 0; i < pending.length; i += CHUNK) {
    if (window._searchSeq !== seq) return;  // 已有新一轮搜索，丢弃旧请求
    const chunk = pending.slice(i, i + CHUNK);
    const _pt = getProductType();
    if (countEl) countEl.textContent = `共 ${results.length} ${unitWord(_pt)}${_pt === 'box_pack' ? '卡包' : '卡片'} · 详情 ${Math.min(i + CHUNK, pending.length)}/${pending.length}`;
    const items = chunk.map(r => ({
      id: r.id,
      catalog_id: cardCatalog[r.id] || r.catalog_id || '',
      product_type: cardTypes[r.id] || 'single',
    }));
    try {
      const res = await fetch('/api/search-details', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({items}),
      });
      const data = await res.json();
      if (window._searchSeq !== seq) return;
      chunk.forEach(r => {
        const d = data && data.details && data.details[r.id];
        if (d) {
          condCache[r.id] = d;
          renderConditionDetail(r.id, d);
        }
      });
    } catch(e) {
      if (window._searchSeq !== seq) return;
      chunk.forEach(r => {
        const box = document.getElementById(`cond-${r.id}`);
        if (box && !condCache[r.id]) box.innerHTML = '<span style="color:#ef4444">详情获取超时</span>';
      });
    }
  }
  if (window._searchSeq === seq && countEl) {
    const _pt = getProductType();
    countEl.textContent = `共 ${results.length} ${unitWord(_pt)}${_pt === 'box_pack' ? '卡包' : '卡片'}`;
  }
}

async function loadConditionPrices(cardId) {
  if (condCache[cardId]) {
    renderConditionDetail(cardId, condCache[cardId]);
    return;
  }

  const box = document.getElementById(`cond-${cardId}`);
  if (!box) return;

  try {
    const qs = [];
    if (cardCatalog[cardId]) qs.push(`catalog=${encodeURIComponent(cardCatalog[cardId])}`);
    qs.push(`type=${cardTypes[cardId] === 'box_pack' ? 'box_pack' : 'single'}`);
    const res = await fetch(`/api/conditions/${cardId}?${qs.join('&')}`, { timeout: 30000 });
    const data = await res.json();
    if (data.error) {
      box.innerHTML = `<span style="color:#ef4444">详情获取失败: ${escapeHtml(data.error)}</span>`;
      return;
    }
    condCache[cardId] = data;
    renderConditionDetail(cardId, data);
  } catch(e) {
    box.innerHTML = `<span style="color:#ef4444">详情获取超时</span>`;
  }
}

function renderConditionDetail(cardId, d) {
  const container = document.getElementById(`cond-${cardId}`);
  if (!container) return;

  const conditions = d.conditions || {};
  const isBox = d.product_type === 'box_pack' || cardTypes[cardId] === 'box_pack';
  if (!window._condSelections) window._condSelections = {};
  const selected = window._condSelections[cardId] || null;

  const metaParts = [];
  if (d.brand) metaParts.push(d.brand);
  if (d.product_code) metaParts.push(`品番: ${d.product_code}`);
  if (d.listing_count != null) metaParts.push(`在售 ${d.listing_count} ${isBox ? '個' : '件'}`);
  if (isBox && d.regular_price != null) metaParts.push(`定価 ${fmtHKD(d.regular_price)}`);
  const meta = metaParts.join(' · ');

  // 卡包无成色分级（通常仅新品 S），直接按返回键渲染；卡牌按固定成色顺序
  const gradeKeys = isBox
    ? Object.keys(conditions).sort((a, b) => a === 'S' ? -1 : b === 'S' ? 1 : a.localeCompare(b))
    : GRADE_ORDER;

  // 成色框顶部只显示一行「品牌 · 品番 · 在售 N 件」，下面直接是各成色
  const header = meta
    ? `<div style="color:var(--text-muted);font-size:12px;margin-bottom:4px">${escapeHtml(meta)}</div>`
    : '';

  const unitLabel = isBox ? '1個' : '1枚';
  const chips = gradeKeys.map(g => {
    const c = conditions[g];
    if (!c) return '';
    const has = c.has_listing && c.price != null;      // 当前是否在库
    const soldOk = c.sold_price != null;               // 是否有最新已售记录
    // 卡包即使当前无在售，只要有最新成交价也允许选择；卡牌维持原有「在售才可选」
    const canPick = isBox ? (has || soldOk) : has;
    // 价格优先显示「最新已售」；无已售记录时退回显示当前在售价
    const price = soldOk ? fmtHKD(c.sold_price) : (has ? fmtHKD(c.price) : '-');
    const gradeLabel = isBox && g === 'S' ? 'S 新品' : g;
    const isChecked = selected === g;
    let style = 'display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin:3px 6px 3px 0;padding:3px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;';
    if (isChecked) style += 'background:var(--primary);color:#fff;border-color:var(--primary)';
    else if (!canPick) style += 'opacity:.55;background:var(--bg-input);color:var(--text-muted);cursor:not-allowed';
    else style += 'background:var(--bg-input);color:var(--text)';

    const stockText = has ? '在售' : '缺货';
    const dateText = soldOk ? fmtSoldDate(c.sold_at) : '';
    const tip = `${gradeLabel}${soldOk ? ' · 最新已售(' + unitLabel + ') ' + fmtSoldFull(c.sold_at) : (has ? ' · 暂无已售记录，显示当前在售价' : ' · 缺货')}`;
    return `<label style="${style}" title="${escapeHtml(tip)}">
      <input type="radio" name="cond-${cardId}" value="${g}"
             ${isChecked ? 'checked' : ''}
             ${canPick ? '' : 'disabled'}
             onchange="selectCondition('${cardId}', '${g}')"
             style="display:none">
      <span style="font-weight:600">${gradeLabel}</span>
      <span>${price}</span>
      ${soldOk
        ? `<span style="font-size:10px;opacity:.8">已售${dateText}</span>`
        : `<span style="font-size:11px;opacity:.75">${stockText}</span>`}
    </label>`;
  }).join('');

  container.innerHTML = header + (chips || '<span style="color:var(--text-muted)">页面上无在售状态</span>');
}

function selectCondition(cardId, grade) {
  if (!window._condSelections) window._condSelections = {};
  window._condSelections[cardId] = grade;
  // 直接点击成色(状态)时，默认同时勾选这张卡牌，方便直接“爬取选中”
  const cb = document.querySelector(`.card-check[value="${cardId}"]`);
  if (cb && !cb.checked) {
    cb.checked = true;
    updateCrawlBtn();
  }
  renderConditionDetail(cardId, condCache[cardId] || {});
}

// ============================================================
//  爬取
// ============================================================
async function crawlSelected() {
  const ids = Array.from(document.querySelectorAll('.card-check:checked')).map(cb => cb.value);
  if (!ids.length) return toast('请先选择要爬取的卡片', 'error');

  // 收集全部成色价格 + 选中的成色
  const conditions = {};
  ids.forEach(cid => {
    const ptype = cardTypes[cid] === 'box_pack' ? 'box_pack' : 'single';
    if (condCache[cid]) {
      let selected = (window._condSelections && window._condSelections[cid]) || null;
      // 卡包无成色分级，未手动选择时默认取新品 S（无 S 则取第一个有有效价的成色）
      if (!selected && ptype === 'box_pack') {
        const cs = condCache[cid].conditions || {};
        if (cs['S']) selected = 'S';
        else selected = Object.keys(cs)[0] || null;
      }
      conditions[cid] = {
        all_prices: condCache[cid].conditions || {},  // 所有成色价格
        selected: selected,                            // 选中的等级
        product_type: ptype,                           // single / box_pack
      };
    } else {
      // 详情未加载完成时也把类型传给后端，由后端自行抓取详情
      conditions[cid] = {all_prices: null, selected: null, product_type: ptype};
    }
  });

  const btn = document.getElementById('crawlBtn');
  btn.disabled = true; btn.textContent = '爬取中...';

  const statusEl = document.getElementById('crawlStatus');
  statusEl.style.display = 'block';

  try {
    const res = await fetch('/api/crawl', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({card_ids: ids, conditions: conditions}),
    });
    const data = await res.json();
    if (data.error) { toast(data.error, 'error'); return; }

    // 轮询进度
    pollCrawlStatus(ids.length);
  } catch(e) {
    toast('启动爬取失败: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = '爬取选中';
  }
}

function pollCrawlStatus(total) {
  const progressBar = document.getElementById('crawlProgress');
  const msg = document.getElementById('crawlMsg');
  const btn = document.getElementById('crawlBtn');

  const interval = setInterval(async () => {
    try {
      const res = await fetch('/api/crawl/status');
      const status = await res.json();

      const pct = total > 0 ? Math.round(status.done / total * 100) : 0;
      progressBar.style.width = pct + '%';
      msg.textContent = `[${status.done}/${total}] ${status.progress}`;

      if (!status.running || status.done >= total) {
        clearInterval(interval);
        btn.disabled = false; btn.textContent = '爬取选中';
        toast(`爬取完成: 共处理 ${total} 项`, 'success');
        loadData();
        loadStats();
        setTimeout(() => {
          document.getElementById('crawlStatus').style.display = 'none';
        }, 3000);
      }
    } catch(e) {
      clearInterval(interval);
    }
  }, 1000);
}

// ============================================================
//  加载数据
// ============================================================
async function loadData(refreshBtn) {
  if (refreshBtn) {
    refreshBtn.disabled = true;
    refreshBtn.textContent = '⏳ ...';
  }
  try {
    const res = await fetch('/api/data');
    const data = await res.json();
    if (data.error) {
      toast('加载数据失败: ' + data.error, 'error');
      return;
    }

    // 更新 tab 计数
    document.querySelectorAll('.tab-btn')[1].textContent = `📦 数据 (${data.count})`;

    const tbody = document.getElementById('dataTableBody');
    const empty = document.getElementById('dataEmpty');

    if (!data.cards.length) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';
    window._allData = data.cards;
    filterData();
    toast('已刷新', 'success');
  } catch(e) {
    toast('刷新失败: ' + e.message, 'error');
  } finally {
    if (refreshBtn) {
      refreshBtn.disabled = false;
      refreshBtn.textContent = '🔄 刷新';
    }
  }
}

function filterData() {
  const filter = document.getElementById('dataFilter').value.toLowerCase();
  const cards = window._allData || [];
  const filtered = filter ? cards.filter(c => (c.card_name||'').toLowerCase().includes(filter)) : cards;

  const tbody = document.getElementById('dataTableBody');
  tbody.innerHTML = filtered.map(c => `
    <tr data-id="${c.id}" style="font-size:15px">
      <td><input type="checkbox" class="data-check" value="${c.id}" onchange="updateBatchDelBtn()"></td>
      <td class="text-muted" style="font-size:13px">${c.id}</td>
      <td>
        <div style="display:flex;align-items:center;gap:12px">
          <img src="${c.thumbnail_url || ''}" 
               onerror="this.style.display='none'"
               style="width:72px;height:100px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border)"
               data-img="${escapeHtml(c.thumbnail_url || '')}" data-title="${escapeHtml(c.card_name||'')}"
               onclick="if(this.dataset.img) showImage(this.dataset.img, this.dataset.title)"
               alt="">
          <a href="https://snkrdunk.com/apparels/${c.id}" target="_blank" style="color:#818cf8;text-decoration:none;font-size:15px">${escapeHtml(c.card_name||'')}</a>
        </div>
      </td>
      <td style="font-size:14px">${escapeHtml(c.brand||'')}</td>
      <td style="font-size:15px">${c.deal_condition ? `<strong>${escapeHtml(c.deal_condition)}</strong>` : '-'}</td>
      <td style="font-size:16px"><strong>${c.deal_price != null ? fmtHKD(c.deal_price) : fmtHKD(c.min_price)}</strong></td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteCard('${c.id}')" style="padding:6px 12px;font-size:12px">删除</button></td>
    </tr>
  `).join('');
  updateBatchDelBtn();
}

// ============================================================
//  删除数据
// ============================================================
function updateBatchDelBtn() {
  const checked = document.querySelectorAll('.data-check:checked').length;
  const btn = document.getElementById('batchDelBtn');
  const importBtn = document.getElementById('importBtn');
  btn.style.display = checked ? 'inline-flex' : 'none';
  btn.textContent = `删除选中 (${checked})`;
  importBtn.style.display = checked ? 'inline-flex' : 'none';
  importBtn.textContent = `导入 MySQL (${checked})`;
}

function toggleDataAll() {
  const checked = document.getElementById('dataSelectAll').checked;
  document.querySelectorAll('.data-check').forEach(cb => cb.checked = checked);
  updateBatchDelBtn();
}

async function deleteCard(id) {
  if (!(await askConfirm(`确定要删除 ID=${id} 的卡片吗？`))) return;
  await _doDelete([id]);
}

async function batchDelete() {
  const ids = Array.from(document.querySelectorAll('.data-check:checked')).map(cb => cb.value);
  if (!ids.length) return;
  if (!(await askConfirm(`确定要删除选中的 ${ids.length} 张卡片吗？`))) return;
  await _doDelete(ids);
}

async function _doDelete(ids) {
  try {
    const res = await fetch('/api/data/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({card_ids: ids}),
    });
    const data = await res.json();
    if (data.error) return toast(data.error, 'error');
    toast(data.message, 'success');
    loadData();
    loadStats();
  } catch(e) {
    toast('删除失败: ' + e.message, 'error');
  }
}

// ============================================================
//  导入 MySQL
// ============================================================
async function importToMySQL() {
  const ids = Array.from(document.querySelectorAll('.data-check:checked')).map(cb => cb.value);
  if (!ids.length) return toast('请先选择要导入的卡片', 'error');
  if (!(await askConfirm(`确定要导入选中的 ${ids.length} 张卡片到 MySQL 吗？`))) return;

  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';

  try {
    const res = await fetch('/api/data/import-mysql', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({card_ids: ids}),
    });
    const data = await res.json();
    if (data.error) return toast(data.error, 'error');

    // 诊断信息
    let diag = '';
    if (data.table_columns && data.table_columns.length) {
      diag += `\n表字段: ${data.table_columns.join(', ')}`;
    }
    if (data.insert_columns && data.insert_columns.length) {
      diag += `\n实际插入字段: ${data.insert_columns.join(', ')}`;
    }
    if (data.verify_error) {
      diag += `\n验证错误: ${data.verify_error}`;
    }

    toast(data.message + diag, 'success');
    // 刷新数据列表和统计
    loadData();
    loadStats();
  } catch(e) {
    toast('导入失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = `导入 MySQL (${ids.length})`;
  }
}

// ============================================================
//  统计
// ============================================================
async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();
    if (data.error) return;

    window._statsImportedData = data.imported_cards || [];
    window._statsNotImportedData = data.not_imported_cards || [];

    const grid = document.getElementById('statsGrid');
    grid.innerHTML = `
      <div class="stat-card"><div class="num">${data.total_cards}</div><div class="label">本地卡片总数</div></div>
      <div class="stat-card"><div class="num" style="color:#22c55e">${data.imported_count}</div><div class="label">已导入 MySQL</div></div>
      <div class="stat-card"><div class="num" style="color:#f59e0b">${data.not_imported_count}</div><div class="label">未导入 MySQL</div></div>
      <div class="stat-card"><div class="num" style="font-size:14px">${data.mysql_connected ? '✅ 已连接' : '❌ 未连接'}</div><div class="label">MySQL 状态</div></div>
    `;

    // 重置筛选条件
    document.getElementById('statsNameFilter').value = '';
    document.getElementById('statsConditionFilter').value = '';

    filterStats();
  } catch(e) {}
}

function filterStats() {
  const imported = window._statsImportedData || [];
  const notImported = window._statsNotImportedData || [];
  const nameFilter = (document.getElementById('statsNameFilter').value || '').toLowerCase().trim();
  const condFilter = document.getElementById('statsConditionFilter').value;

  // 筛选已导入
  const filteredImported = imported.filter(c => {
    if (nameFilter && !(c.card_name || '').toLowerCase().includes(nameFilter)) return false;
    if (condFilter && c.deal_condition !== condFilter) return false;
    return true;
  });

  // 筛选未导入
  const filteredNotImported = notImported.filter(c => {
    if (nameFilter && !(c.name || '').toLowerCase().includes(nameFilter)) return false;
    return true;
  });

  // 渲染已导入
  const impEl = document.getElementById('statsImported');
  if (filteredImported.length) {
    impEl.innerHTML = `
      <div style="font-size:16px;font-weight:600;color:#22c55e;margin-bottom:10px">✅ 已导入 MySQL (${filteredImported.length}${filteredImported.length < imported.length ? '/' + imported.length : ''})</div>
      <div class="table-wrap"><table style="font-size:14px">
        <thead><tr><th style="font-size:14px">ID</th><th style="font-size:14px">爬蟲ID</th><th style="font-size:14px">名称</th><th style="font-size:14px">品牌</th><th style="font-size:14px">类型</th><th style="font-size:14px">成色</th><th style="font-size:14px">成交价</th><th style="font-size:14px">更新时间</th><th style="font-size:14px">更新</th><th style="font-size:14px">操作</th></tr></thead>
        <tbody>${filteredImported.map(c => `
          <tr style="font-size:15px">
            <td class="text-muted" style="font-size:12px">${c.row_id || '-'}</td>
            <td class="text-muted" style="font-size:13px">${escapeHtml(c.id)}</td>
            <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(c.card_name||'')}">${c.card_img ? `<img src="${c.card_img}" onerror="this.style.display='none'" style="width:40px;height:56px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:6px;cursor:pointer;border:1px solid var(--border)" data-img="${escapeHtml(c.card_img)}" data-title="${escapeHtml(c.card_name||'')}" onclick="showImage(this.dataset.img, this.dataset.title)">` : ''}${escapeHtml(c.card_name)}</td>
            <td style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px" title="${escapeHtml(c.card_brand||'')}">${escapeHtml(c.card_brand||'')}</td>
            <td style="font-size:14px">${escapeHtml(c.card_type||'-')}</td>
            <td style="font-size:15px">${c.deal_condition ? `<strong>${escapeHtml(c.deal_condition)}</strong>` : '-'}</td>
            <td style="font-size:16px"><strong>${c.deal_price != null ? fmtHKD(c.deal_price) : '-'}</strong></td>
            <td class="text-muted" style="font-size:12px">${c.updated_at ? c.updated_at.slice(0,19).replace('T',' ') : (c.created_at ? c.created_at.slice(0,19).replace('T',' ') : '')}</td>
            <td style="text-align:center">
              <label class="switch-wrap">
                <input type="checkbox" ${c.is_update ? 'checked' : ''} onchange="toggleCardUpdate('${escapeHtml(c.id)}', this.checked)">
                <span class="switch-slider"></span>
              </label>
            </td>
            <td style="white-space:nowrap">
              <button class="btn btn-primary btn-sm" onclick="statsUpdateCard('${escapeHtml(c.id)}', this)" title="手动爬取最新价格并更新" style="padding:4px 8px;font-size:11px;margin-right:6px">手动更新</button>
              <button class="btn btn-danger btn-sm" onclick="statsDeleteCard(${c.row_id}, this)" style="padding:4px 8px;font-size:11px">删除</button>
            </td>
          </tr>
        `).join('')}</tbody>
      </table></div>`;
  } else {
    impEl.innerHTML = '<div style="color:var(--text-muted);padding:12px 0">暂无匹配数据</div>';
  }

  // 渲染未导入
  const notImpEl = document.getElementById('statsNotImported');
  if (filteredNotImported.length) {
    notImpEl.innerHTML = `
      <div style="font-size:16px;font-weight:600;color:#f59e0b;margin-bottom:10px">⬇ 未导入 (${filteredNotImported.length}${filteredNotImported.length < notImported.length ? '/' + notImported.length : ''})</div>
      <div class="table-wrap"><table style="font-size:14px">
        <thead><tr><th style="font-size:14px">ID</th><th style="font-size:14px">名称</th><th style="font-size:14px">最低价</th></tr></thead>
        <tbody>${filteredNotImported.map(c => `
          <tr style="font-size:15px"><td class="text-muted" style="font-size:13px">${escapeHtml(c.id)}</td><td>${escapeHtml(c.name)}</td><td style="font-size:16px"><strong>${fmtHKD(c.price)}</strong></td></tr>
        `).join('')}</tbody>
      </table></div>`;
  } else {
    notImpEl.innerHTML = '<div style="color:var(--text-muted);padding:12px 0">暂无匹配数据</div>';
  }
}

// ============================================================
//  自动更新价格设置
// ============================================================
async function loadAutoUpdateSettings() {
  try {
    const res = await fetch('/api/settings/auto-update');
    const data = await res.json();
    if (!data.success) return;
    const s = data.settings;
    document.getElementById('autoUpdateToggle').checked = s.enabled;
    document.getElementById('autoUpdateTime1').value = s.time1;
    document.getElementById('autoUpdateTime2').value = s.time2;
  } catch(e) {}
}

async function saveAutoUpdateSettings() {
  const enabled = document.getElementById('autoUpdateToggle').checked;
  const time1 = document.getElementById('autoUpdateTime1').value;
  const time2 = document.getElementById('autoUpdateTime2').value;
  try {
    await fetch('/api/settings/auto-update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled, time1, time2}),
    });
    document.getElementById('autoUpdateStatus').textContent = '✅ 设置已保存';
    setTimeout(() => document.getElementById('autoUpdateStatus').textContent = '', 2000);
  } catch(e) {
    document.getElementById('autoUpdateStatus').textContent = '❌ 保存失败';
  }
}

async function runAutoUpdateNow() {
  const btn = event.target;
  const statusEl = document.getElementById('autoUpdateStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 更新中...';
  statusEl.innerHTML = '⏳ 正在更新价格（仅限 is_update=1 的卡片），请稍候...';
  try {
    const res = await fetch('/api/auto-update/run-now', {method: 'POST'});
    const data = await res.json();
    if (data.success) {
      statusEl.innerHTML = `<span style="color:#22c55e">✅ ${data.message}</span>
        <span style="margin-left:12px;font-size:12px;color:var(--text-muted)">更新 ${data.total} 张 | 成功 ${data.updated} 张 | 失败 ${data.failed} 张</span>`;
    } else {
      statusEl.innerHTML = `<span style="color:#ef4444">❌ ${data.error || '更新失败'}</span>`;
    }
  } catch(e) {
    statusEl.innerHTML = `<span style="color:#ef4444">❌ 请求失败: ${e.message}</span>`;
  }
  btn.disabled = false;
  btn.textContent = '🔄 手动更新';
}

async function statsUpdateCard(cardId, btn) {
  if (!(await askConfirm(`确定手动爬取并更新 ID=${cardId} 的最新价格吗？`))) return;
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '更新中...';
  try {
    const res = await fetch('/api/stats/update-card', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({card_id: cardId}),
    });
    const data = await res.json();
    if (data.success) {
      toast(data.message || '更新成功', 'success');
    } else {
      toast(data.error || data.message || '更新失败', 'error');
    }
  } catch(e) {
    toast('更新失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
    loadStats();
  }
}

async function statsDeleteCard(rowId, btn) {
  if (!(await askConfirm(`确定从数据库删除 ID=${rowId} 的卡牌吗？`))) return;
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch('/api/stats/delete-row', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({row_id: rowId}),
    });
    const data = await res.json();
    if (data.success) {
      const tr = btn.closest('tr');
      if (tr) tr.remove();
      loadStats();
    } else {
      toast('删除失败: ' + (data.message || data.error || '未知错误'), 'error');
      btn.disabled = false;
      btn.textContent = '删除';
    }
  } catch(e) {
    toast('删除失败: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '删除';
  }
}

async function toggleCardUpdate(cardId, enabled) {
  try {
    const res = await fetch('/api/stats/toggle-update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({card_id: cardId, is_update: enabled}),
    });
    const data = await res.json();
    if (!data.success) {
      toast('切换失败: ' + (data.message || data.error || '未知错误'), 'error');
    }
  } catch(e) {
    toast('切换失败: ' + e.message, 'error');
  }
}

// ============================================================
//  汇率(JPY→HKD，存入資料庫) + 搜索筛选项
// ============================================================
let FX_RATE = null;      // 1 JPY = ? HKD（僅顯示用，價格已由後端換算為港幣）
let FX_RATE_TIME = '';

async function loadRate() {
  try {
    const res = await fetch('/api/rate');
    const d = await res.json();
    if (d && d.success) {
      FX_RATE = d.rate;
      FX_RATE_TIME = d.fetched_at || '';
    }
  } catch(e) {}
  renderFx();
}

function renderFx() {
  const el = document.getElementById('fxLabel');
  if (!el) return;
  if (FX_RATE) {
    const t = FX_RATE_TIME ? `（更新：${FX_RATE_TIME}）` : '';
    el.textContent = `JPY→HKD: 1 JPY = HK$${Number(FX_RATE).toFixed(5)}${t}`;
    el.title = '抓取到的價格會以最新匯率換算成港幣並存入資料庫；取得失敗時使用資料庫最新匯率';
  } else {
    el.textContent = '匯率取得失敗（無法換算港幣）';
  }
  // 重新渲染已展示的数据
  if (window._statsImportedData !== undefined) filterStats();
  if (searchResults && searchResults.length) renderSearchResults(searchResults);
}

// 直接格式化「已換算好的港币金额」（後端已把日元換算為港幣）
function fmtHKD(v) {
  if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '-';
  const n = Number(v);
  return 'HK$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

// 后端返回的已售时间（ISO UTC），换算本地时区
function toLocalDate(s) {
  if (!s) return null;
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtSoldDate(s) {
  const d = toLocalDate(s);
  if (!d) return '';
  return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
}
function fmtSoldFull(s) {
  const d = toLocalDate(s);
  if (!d) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ============================================================
//  工具
// ============================================================
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Image viewer
function showImage(url, title) {
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('modalImage');
  const titleEl = document.getElementById('modalTitle');
  img.src = url;
  titleEl.textContent = title || '';
  modal.classList.add('active');
}
function closeImage() {
  document.getElementById('imageModal').classList.remove('active');
}

// 自製確認框（回傳 Promise<boolean>，避免使用原生 window.confirm）
function askConfirm(message) {
  return new Promise((resolve) => {
    const modal = document.getElementById('confirmModal');
    const msgEl = document.getElementById('confirmMsg');
    const okBtn = document.getElementById('confirmOk');
    const cancelBtn = document.getElementById('confirmCancel');
    msgEl.textContent = message;
    const done = (val) => {
      modal.classList.remove('active');
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      modal.onclick = null;
      resolve(val);
    };
    okBtn.onclick = () => done(true);
    cancelBtn.onclick = () => done(false);
    modal.onclick = (e) => { if (e.target === modal) done(false); };
    modal.classList.add('active');
    okBtn.focus();
  });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const cm = document.getElementById('confirmModal');
    if (cm && cm.classList.contains('active')) {
      const cb = document.getElementById('confirmCancel');
      if (cb) cb.click();
      return;
    }
    closeImage();
  }
});

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function updateCrawlBtn() {
  const checked = document.querySelectorAll('.card-check:checked').length;
  document.getElementById('crawlBtn').textContent = `爬取选中 (${checked})`;
}

// ============================================================
//  修改密码弹窗
// ============================================================
function showChangePwd() {
  document.getElementById('cpOld').value = '';
  document.getElementById('cpNew').value = '';
  document.getElementById('cpNew2').value = '';
  document.getElementById('changePwdError').style.display = 'none';
  document.getElementById('changePwdModal').classList.add('active');
  setTimeout(() => document.getElementById('cpOld').focus(), 50);
}
function hideChangePwd() {
  document.getElementById('changePwdModal').classList.remove('active');
}
async function doChangePwd() {
  const oldV = document.getElementById('cpOld').value;
  const newV = document.getElementById('cpNew').value;
  const new2 = document.getElementById('cpNew2').value;
  const errEl = document.getElementById('changePwdError');
  const btn = document.getElementById('cpSubmitBtn');

  errEl.style.display = 'none';

  if (!oldV || !newV || !new2) { errEl.textContent = '请填写所有字段'; errEl.style.display = 'block'; return; }
  if (newV.length < 6) { errEl.textContent = '新密码至少 6 位'; errEl.style.display = 'block'; return; }
  if (newV !== new2) { errEl.textContent = '两次输入的新密码不一致'; errEl.style.display = 'block'; return; }
  if (oldV === newV) { errEl.textContent = '新密码不能和旧密码相同'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const res = await fetch('/api/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old_password: oldV, new_password: newV}),
    });
    const data = await res.json();
    if (data.success) {
      hideChangePwd();
      toast('✅ ' + data.message, 'success');
      // 修改密码后退出登录，强制用新密码登录
      setTimeout(() => { location.href = '/logout'; }, 1500);
    } else {
      errEl.textContent = data.error || '修改失败';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = '请求失败: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '确认修改';
  }
}

// ============================================================
//  远程重启服务
// ============================================================
async function restartService() {
  if (!(await askConfirm('确定要重启服务吗？重启期间页面会短暂不可访问（约 3-5 秒）。'))) return;

  try {
    const res = await fetch('/api/restart', {method: 'POST'});
    const data = await res.json();
    if (data.success) {
      toast('🔄 ' + data.message, 'success');
      // 3 秒后自动刷新页面
      setTimeout(() => location.reload(), 3000);
    } else {
      toast(data.error || '重启失败', 'error');
    }
  } catch(e) {
    toast('重启请求失败: ' + e.message, 'error');
  }
}
